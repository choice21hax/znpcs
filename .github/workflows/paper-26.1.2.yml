name: Paper 26.1.2 Compatibility

on:
  push:
    branches: [ "paper-26.1.2" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew clean build --stacktrace

      - name: Smoke boot on Paper 26.1.2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p smoke/plugins/ServersNPC
          cp bukkit/build/libs/*.jar smoke/plugins/ServersNPC.jar

          # Regression fixture: an existing NPC must be restored from the same legacy JSON
          # shape produced by released ZNPCs builds, including decimal-form integer fields.
          cat > smoke/plugins/ServersNPC/data.json <<'JSON'
          {
            "NPC_LIST": [
              {
                "id": 9001.0,
                "hologramHeight": 0.0,
                "skin": "",
                "signature": "",
                "skinName": "Steve",
                "location": {
                  "world": "world",
                  "x": 0.5,
                  "y": 80.0,
                  "z": 0.5,
                  "yaw": 0.0,
                  "pitch": 0.0
                },
                "npcType": "PLAYER",
                "hologramLines": ["CI Persisted NPC"],
                "refreshSkinDuration": 0.0,
                "clickActions": [],
                "npcEquip": {},
                "npcFunctions": {"look": true},
                "customizationMap": {}
              }
            ]
          }
          JSON

          cd smoke

          USER_AGENT='choice21hax-znpcs-ci/1.0 (https://github.com/choice21hax/znpcs)'
          BUILDS="$(curl -fsSL -H "User-Agent: ${USER_AGENT}" \
            https://fill.papermc.io/v3/projects/paper/versions/26.1.2/builds)"
          PAPER_URL="$(printf '%s' "$BUILDS" | jq -r \
            'first(.[] | select(.channel == "STABLE") | .downloads."server:default".url) // first(.[].downloads."server:default".url) // empty')"

          if [ -z "$PAPER_URL" ]; then
            echo 'Unable to resolve a Paper 26.1.2 server download.' >&2
            exit 1
          fi

          curl -fL -H "User-Agent: ${USER_AGENT}" "$PAPER_URL" -o paper.jar
          echo 'eula=true' > eula.txt

          java -Xms512M -Xmx1024M -jar paper.jar --nogui > server.log 2>&1 &
          SERVER_PID=$!
          BOOTED=0

          for _ in $(seq 1 120); do
            if grep -q 'Done (' server.log 2>/dev/null; then
              BOOTED=1
              break
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          cat server.log
          kill "$SERVER_PID" 2>/dev/null || true
          wait "$SERVER_PID" 2>/dev/null || true

          if [ "$BOOTED" -ne 1 ]; then
            echo 'Paper did not complete startup.' >&2
            exit 1
          fi

          if grep -Eqi 'Error occurred while (loading|enabling) ServersNPC|Could not load.*ServersNPC|Failed to load.*ServersNPC|Exception.*ServersNPC' server.log; then
            echo 'ServersNPC reported a load/enable exception.' >&2
            exit 1
          fi

          grep -qi 'Enabling ServersNPC' server.log
          grep -qi 'Using embedded PacketEvents' server.log
          grep -Fqi 'Loaded 1 persisted NPC(s) from data.json.' server.log

          if grep -Fqi 'Failed to restore persisted NPC' server.log; then
            echo 'Persisted NPC restoration failed.' >&2
            exit 1
          fi

      - name: Upload plugin jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ServersNPC-Paper-26.1.2
          path: bukkit/build/libs/*.jar
          if-no-files-found: error
